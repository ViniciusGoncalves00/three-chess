<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="/src/main.ts"></script>
</head>
<body x-data class="ds-bg-primary ds-text-primary h-screen w-full flex flex-col">
    <header class="w-full p-4 flex items-center justify-between space-x-4">
        <div class="h-full flex items-center">
            <button type="button" class="px-2 py-2 space-x-1 flex-none flex items-center justify-center cursor-pointer transition-colors duration-500 border-b-2 border-amber-500/0 hover:border-amber-500">
                <span @click="$store.navigator.goHome()" class="flex items-center justify-center text-md font-bold uppercase">chess</span>
            </button>
        </div>
        <div class="h-full flex items-center"></div>
        <div class="h-full space-x-4 flex items-center">
            <button type="button" class="px-2 py-2 space-x-1 flex-none flex items-center justify-center cursor-pointer transition-colors duration-500 border-b-2 border-amber-500/0 hover:border-amber-500">
                <span class="flex items-center justify-center text-md font-bold uppercase">sign up</span>
            </button>
            <button type="button" class="px-2 py-2 space-x-1 flex-none flex items-center justify-center cursor-pointer transition-colors duration-500 border-b-2 border-amber-500/0 hover:border-amber-500">
                <span @click="$store.navigator.goLogin()" class="flex items-center justify-center text-md font-bold uppercase">log in</span>
            </button>
        </div>
    </header>
    <main class="h-full w-full">
        <div x-show="$store.navigator.isHome()"></div>
        <div x-show="$store.navigator.isLogin()" class="h-full w-full flex items-center justify-center">
            <form class="space-y-2 flex flex-col">
                <span class="ds-bg-secondary px-4 py-2 space-x-2 flex items-center rounded transition-colors duration-300 outline-transparent hover:outline-amber-500 hover:outline active:outline">
                    <i class="bi bi-person"></i>
                    <label for="username"></label>
                    <input id="username" placeholder="username" type="text" class="appearance-none bg-transparent border-none outline-none shadow-none p-0 m-0">
                </span>
                <span class="ds-bg-secondary px-4 py-2 space-x-2 flex items-center rounded transition-colors duration-300 outline-transparent hover:outline-amber-500 hover:outline active:outline">
                    <i class="bi bi-envelope"></i>
                    <label for="email"></label>
                    <input id="email" placeholder="example@mail.com" type="email" class="appearance-none bg-transparent border-none outline-none shadow-none p-0 m-0">
                </span>
                <span class="ds-bg-secondary px-4 py-2 space-x-2 flex items-center rounded transition-colors duration-300 outline-transparent hover:outline-amber-500 hover:outline active:outline" x-data="{ visible: false }">
                    <i class="bi bi-lock"></i>
                    <label for="password"></label>
                    <input id="password" placeholder="password" :type="visible ? 'text' : 'password'" class="appearance-none bg-transparent border-none outline-none shadow-none p-0 m-0">
                    <i @click="visible = !visible" class="bi cursor-pointer" :class="visible ? 'bi-eye-slash' : 'bi-eye'"></i>
                </span>
                <button
                    class="ds-bg-secondary ds-border-default hover:ds-bg-elevated-primary px-4 py-1 space-x-2 flex items-center justify-center border rounded cursor-pointer transition-colors duration-300">
                    <span>Continue</span>
                </button>
                <div class="py-2 flex items-center space-x-2 w-full">
                    <div class="flex-1 h-px ds-bg-secondary"></div>
                    <span class="ds-text-secondary whitespace-nowrap">or</span>
                    <div class="flex-1 h-px ds-bg-secondary"></div>
                </div>
                <button
                    class="ds-bg-secondary ds-border-default hover:ds-bg-elevated-primary px-4 py-1 space-x-2 flex items-center justify-center border rounded cursor-pointer transition-colors duration-300"
                    @click="window.location.href='/api/auth/google'">
                    <i class="bi bi-phone text-xs"></i>
                    <span>Continue with Phone</span>
                </button>
                <button
                    class="ds-bg-secondary ds-border-default hover:ds-bg-elevated-primary px-4 py-1 space-x-2 flex items-center justify-center border rounded cursor-pointer transition-colors duration-300"
                    @click="window.location.href='/api/auth/google'">
                    <i class="bi bi-google text-xs"></i>
                    <span>Continue with Google</span>
                </button>
            </form>
        </div>
    </main>
    <footer class="w-full flex items-center justify-center space-x-2">
    </footer>
</body>
