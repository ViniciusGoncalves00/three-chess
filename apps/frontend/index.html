<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="/src/main.ts"></script>
</head>
<body>
    <button id="check-health">Health</button>
    <button id="check-get">Get</button>
    <button id="check-post">Post</button>
    <button id="check-put">Put</button>
    <button id="check-delete">Delete</button>
    <button id="check-options">Options</button>
    <div id="response"></div>
    
    <button class="bg-red-500" id="fire-log-info">Log Info</button>
    <button class="bg-red-500" id="fire-log-warn">Log Warn</button>
    <button class="bg-red-500" id="fire-log-error">Log Error</button>
    <button class="bg-red-500" id="fire-log-clear">Log Clear</button>
    <div id="logs"></div>

    <input type="text" id="user-name" placeholder="User Name">
    <input type="text" id="user-email" placeholder="User Email">
    <input type="text" id="user-password" placeholder="User password">

    <button id="create-user">Create User</button>
    <button id="get-user">Get Users</button>
    <div id="users-list"></div>
